name: XPalm PR141 auxiliary public integration
run-name: XPalm public pair PSE-main-8d1f8484 XPalm1496 complete and reference
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: xpalm-public-pair-main-1496-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: ${{ matrix.package.name }} - Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}${{ matrix.test_args && ' - reference-regression' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same full suite/JET row as Integration, with explicit source pins.
          - version: "1.12"
            os: ubuntu-latest
            timeout_minutes: 90
            package: { name: XPalm, user: PalmStudio, repo: XPalm.jl, branch: 1496bb95c9f609c4d38c099aaa4123dc71fa1e0d, default: main }
          # The same full-cycle scientific oracle row as Integration.
          - version: "1"
            os: ubuntu-latest
            package: { name: XPalm, user: PalmStudio, repo: XPalm.jl, branch: 1496bb95c9f609c4d38c099aaa4123dc71fa1e0d, default: main }
            test_args: reference-regression
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8d1f8484c8ad68cc5da8004209b2062070cac28a
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Cache Julia packages
        uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
          save-always: false
      - name: Test the integration source configuration
        shell: julia --color=yes {0}
        run: include(joinpath(pwd(), ".github", "scripts", "test_configure_local_sources.jl"))
      - uses: julia-actions/julia-buildpkg@v1
      - name: Clone Downstream
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
          ref: ${{ matrix.package.branch }}
          path: downstream
          persist-credentials: false
      - name: Clone PlantGeom for XPalm
        if: ${{ matrix.package.name == 'XPalm' }}
        uses: actions/checkout@v7
        with:
          repository: VEZY/PlantGeom.jl
          ref: 1e00511430def53c2a24790f4a8b9a57aa39fac2
          path: sources/PlantGeom
          persist-credentials: false
      - name: Verify and record the exact auxiliary source pair
        env:
          PSE_EXPECTED: 8d1f8484c8ad68cc5da8004209b2062070cac28a
          XPALM_EXPECTED: 1496bb95c9f609c4d38c099aaa4123dc71fa1e0d
          PG_EXPECTED: 1e00511430def53c2a24790f4a8b9a57aa39fac2
        shell: python
        run: |
          import pathlib,subprocess,json,os
          pins={}
          for name,path,key in [("PSE",".","PSE_EXPECTED"),("XPalm","downstream","XPALM_EXPECTED"),("PlantGeom","sources/PlantGeom","PG_EXPECTED")]:
              actual=subprocess.check_output(["git","-C",path,"rev-parse","HEAD"],text=True).strip()
              assert actual==os.environ[key], (name,actual,os.environ[key])
              pins[name]={"checkout_sha":actual,"source":str(pathlib.Path(path).resolve())}
          print(json.dumps(pins,indent=2))
          pathlib.Path("auxiliary-source-pins.json").write_text(json.dumps(pins,indent=2)+"\n")
      - name: Configure local integration sources
        env:
          DOWNSTREAM_PACKAGE: ${{ matrix.package.name }}
        shell: julia --color=yes {0}
        run: |
          include(joinpath(pwd(), ".github", "scripts", "configure_local_sources.jl"))

          project_files = (
              joinpath(pwd(), "downstream", "Project.toml"),
              joinpath(pwd(), "downstream", "test", "Project.toml"),
          )
          source_roots = String[pwd()]
          if ENV["DOWNSTREAM_PACKAGE"] == "XPalm"
              push!(source_roots, joinpath(pwd(), "sources", "PlantGeom"))
          end

          summaries = IntegrationSourceConfig.configure_local_sources!(project_files, source_roots)
          @info "Configured local integration sources" package=ENV["DOWNSTREAM_PACKAGE"] summaries
      - name: Verify the PlantGeom test source
        if: ${{ matrix.package.name == 'PlantGeom' }}
        shell: julia --color=yes --project=downstream/test {0}
        run: |
          using Pkg

          Pkg.resolve()
          pse = get(
              Pkg.dependencies(),
              Base.UUID("9a576370-710b-4269-adf9-4f603a9c6423"),
              nothing,
          )
          pse === nothing && error("PlantSimEngine was not resolved in the PlantGeom test environment")
          pse.is_tracking_path || error("PlantSimEngine is not tracking a local path")
          realpath(pse.source) == realpath(pwd()) || error(
              "PlantSimEngine resolved to $(pse.source), expected $(realpath(pwd()))",
          )
          @info "Verified local PlantSimEngine test source" path=pse.source
      - name: Check out the JET completeness guard used by the reference job
        if: ${{ matrix.package.name == 'XPalm' && !matrix.test_args }}
        uses: actions/checkout@v7
        with:
          ref: 9bbd1c177accb6737bf86c8bfd442cbb9566243b
          path: qualification-harness
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Test the JET analysis failure guard
        if: ${{ matrix.package.name == 'XPalm' && !matrix.test_args }}
        shell: julia --color=yes {0}
        run: include(joinpath(pwd(), "qualification-harness", ".github", "scripts", "test_require_complete_jet.jl"))
      - name: Run the downstream tests
        env:
          DOWNSTREAM_PACKAGE: ${{ matrix.package.name }}
          DOWNSTREAM_TEST_ARGS: ${{ matrix.test_args || '' }}
        shell: julia --threads 4 --color=yes --project=downstream --depwarn=yes {0}
        run: |
          using Pkg

          Pkg.resolve()

          function assert_path_dependency(name, uuid, expected_path)
              package = get(Pkg.dependencies(), Base.UUID(uuid), nothing)
              package === nothing && error("$(name) was not resolved")
              package.is_tracking_path || error("$(name) is not tracking a local path")
              realpath(package.source) == realpath(expected_path) || error(
                  "$(name) resolved to $(package.source), expected $(realpath(expected_path))",
              )
              @info "Verified local integration source" name path=package.source
          end

          if ENV["DOWNSTREAM_PACKAGE"] != "PlantGeom"
              assert_path_dependency(
                  "PlantSimEngine",
                  "9a576370-710b-4269-adf9-4f603a9c6423",
                  pwd(),
              )
          end
          if ENV["DOWNSTREAM_PACKAGE"] == "XPalm"
              assert_path_dependency(
                  "PlantGeom",
                  "5edaa67e-25db-4eb9-bf81-05d793b2238d",
                  joinpath(pwd(), "sources", "PlantGeom"),
              )
          end

          Pkg.status()
          test_args = isempty(ENV["DOWNSTREAM_TEST_ARGS"]) ? String[] : [ENV["DOWNSTREAM_TEST_ARGS"]]
          julia_args = String[]
          if ENV["DOWNSTREAM_PACKAGE"] == "XPalm" && isempty(test_args)
              push!(julia_args, "--load=" * joinpath(pwd(), "qualification-harness", ".github", "scripts", "require_complete_jet.jl"))
          end
          Pkg.test(; test_args, julia_args)
      # This is a separate PR141 qualification, never the PR247 main-branch gate.
      # The normal Integration workflow and its main/master policy are untouched.
      - name: Verify maintained downstream science and assertions are unchanged
        if: always()
        run: |
          git -C downstream diff --exit-code -- . ':(exclude)Project.toml' ':(exclude)test/Project.toml'
          git -C sources/PlantGeom diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpalm-public-pair-${{ matrix.version }}-${{ github.run_id }}
          path: |
            auxiliary-source-pins.json
            downstream/Project.toml
            downstream/Manifest*.toml
            downstream/test/Project.toml
            downstream/test/Manifest*.toml
          if-no-files-found: warn
          retention-days: 14
