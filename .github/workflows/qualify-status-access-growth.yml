name: Validate projected status reads during growth
on:
  push:
    branches: [codex/qualify-inline-kernel-ports]
permissions:
  contents: read
jobs:
  growth:
    if: ${{ !startsWith(github.event.head_commit.message, 'Interleave ' ) && !startsWith(github.event.head_commit.message, 'Benchmark XPalm only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: "1"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 844f259b3c7d1fd815173626378f0cc8a2323fde
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: VEZY/MultiScaleTreeGraph.jl
          ref: b3b39f5d33543fe2775756782ec1c4de33ba5775
          path: public-mtg
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.4"
      - name: Resolve the stock compiler and the exact packages under test
        working-directory: subject
        shell: julia --startup-file=no {0}
        run: |
          using Pkg
          Pkg.activate(joinpath(ENV["RUNNER_TEMP"], "status-growth"))
          Pkg.develop([PackageSpec(path=pwd()), PackageSpec(path=abspath("../public-mtg"))])
          Pkg.add(PackageSpec(name="JuliaC", version=v"0.3.12"))
          Pkg.precompile()
      - name: Check projected status, native growth and multi-type tree labels
        working-directory: subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "844f259b3c7d1fd815173626378f0cc8a2323fde"
          test "$(git -C ../public-mtg rev-parse HEAD)" = "b3b39f5d33543fe2775756782ec1c4de33ba5775"
          echo "49240a69a8378604ec2b34e8844457c6dcfd120f00991404bff05e87733a9d08  ../.ci/xpalm-mixed-routing/src/XPalmLifecycleApp.jl" | sha256sum --check
          julia -C generic --project="$RUNNER_TEMP/status-growth" --startup-file=no -e '
            using Test, PlantSimEngine, JuliaC
            import MultiScaleTreeGraph as MTG
            @assert realpath(pkgdir(PlantSimEngine)) == realpath(pwd())
            @assert realpath(pkgdir(MTG)) == realpath("../public-mtg")
            @assert isdefined(MTG, :attribute_type) && isdefined(MTG, :prepare_node_edits)
            @assert pkgversion(JuliaC) == v"0.3.12"
            @testset "Status" begin
                include("test/test-status-fixed-storage.jl")
                include("test/test-model-status-view-cache-admission.jl")
            end
            include("test/test-organ-status-assembly.jl")
            include("test/test-model-prepared-growth-schemas.jl")
            include("test/integration/native_growth.jl")
            @test !isnothing(PSELocalPalmLeafBirth.TREE_BIRTH)
            const mixed_app = NativeFixtureApps.stage_native_fixture(abspath("../.ci/xpalm-mixed-routing"))
            include(joinpath(mixed_app, "src", "XPalmLifecycleApp.jl"))
            @testset "Mixed inherited labels, rejection and explicit kind in safe mode" begin
                @test XPalmLifecycleApp.main(String[]) == 0
                artifact = Compilation.compile(mixed_app; destination=joinpath(mktempdir(), "bundle"), name="mixed-organ-labels")
                @test isfile(artifact.executable)
                @test success(Cmd([artifact.executable]))
                @test success(Cmd([artifact.executable]))
            end'
