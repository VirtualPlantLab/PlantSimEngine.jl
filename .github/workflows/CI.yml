name: Prepared call schema diagnosis
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepared-call-schemas:
    name: Prepared call schemas - ${{ matrix.source }}
    runs-on: ubuntu-latest
    # Same correctness budget as the normal PSE test matrix.
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        source: [control, candidate]
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select the compared source
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          if [[ "$SOURCE" == control ]]; then
            git show 1db4619a69d4009b04bb4496a98a8ae4b29ec31f:src/composite_model/execution_batch_schemas.jl > src/composite_model/execution_batch_schemas.jl
          fi
          git rev-parse HEAD
          sha256sum src/composite_model/execution_batch_schemas.jl test/test-model-prepared-call-schemas.jl
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run every original prepared call schema case
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.test(; test_args=["test-model-prepared-call-schemas.jl"])
