name: Prepared call schema diagnosis
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact published PlantSimEngine commit to test
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepared-call-schemas:
    name: Prepared call schemas - published head
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: "4"
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Require an exact commit
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Verify the unchanged published source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git rev-parse HEAD
          git diff --exit-code -- src test
          sha256sum src/composite_model/execution_batch_schemas.jl src/composite_model/execution_cohorts.jl src/composite_model/runtime_outputs.jl test/test-model-prepared-call-schemas.jl test/runtests.jl
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.4"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run every original prepared call schema case
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.test(; test_args=["test-model-prepared-call-schemas.jl"])
