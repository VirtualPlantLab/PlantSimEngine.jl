name: Benchmarks
on:
  pull_request_target:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      full_performance:
        description: Run the complete XPalm performance workflow
        required: false
        default: false
        type: boolean
permissions:
  pull-requests: write
  contents: read
jobs:
  bench:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_performance }}
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{
      github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PSE_BENCHMARK_INCLUDE_DOWNSTREAM: "false"
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.12.1"
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: ${{ matrix.version }}
          bench-on: ${{ github.event.pull_request.head.sha }}

  full-performance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_performance }}
    uses: ./.github/workflows/FullPerformance.yml
    with:
      xpalm_ref: codex/xpalm-release-regression
      plantbiophysics_ref: multi-plant
      plantgeom_ref: plantsimengine-multi-plant
