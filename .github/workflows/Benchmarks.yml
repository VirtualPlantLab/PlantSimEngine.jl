name: Benchmarks
on:
  pull_request_target:
    branches: [ main ]
  workflow_dispatch:
permissions:
  pull-requests: write
jobs:
  bench:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{
      github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PSE_BENCHMARK_INCLUDE_DOWNSTREAM: "false"
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.12.1"
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: ${{ matrix.version }}
          bench-on: ${{ github.event.pull_request.head.sha }}
