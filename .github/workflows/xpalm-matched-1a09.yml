name: Matched XPalm execution on one Linux runner
on:
  push:
    branches:
      - codex/qualify-inline-kernel-ports
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 285
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      JULIA_PKG_PRECOMPILE_AUTO: 0
      JULIA_NUM_PRECOMPILE_TASKS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PalmStudio/XPalm.jl
          ref: f44f728dd68e804ffa6bcb872e5b873ce46bf3b5
          path: public-xpalm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: VEZY/MultiScaleTreeGraph.jl
          ref: bcc58a86356d0cbdcafbac721a367e7dcb978fdb
          path: public-mtg
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.3'
      - name: Compare all four PSE revisions with identical XPalm and MTG sources
        run: python3 .ci/xpalm-matched/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-xpalm-linux
          path: ${{ runner.temp }}/xpalm-results/*.json
          if-no-files-found: warn
          retention-days: 14
