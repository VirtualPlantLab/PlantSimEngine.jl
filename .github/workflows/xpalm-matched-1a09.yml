name: Matched XPalm execution on one Linux runner
on:
  push:
    branches:
      - codex/qualify-inline-kernel-ports
permissions:
  contents: read
jobs:
  compare:
    if: ${{ !startsWith(github.event.head_commit.message, 'Interleave ' ) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: legacy
            xpalm: 5795bb0984516830c3ffb6fd1d2ca57f54f9e8cd
          - scenario: modern
            xpalm: f44f728dd68e804ffa6bcb872e5b873ce46bf3b5
    runs-on: ubuntu-24.04
    timeout-minutes: 285
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      JULIA_PKG_PRECOMPILE_AUTO: 0
      JULIA_NUM_PRECOMPILE_TASKS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PalmStudio/XPalm.jl
          ref: ${{ matrix.xpalm }}
          path: public-xpalm
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: VEZY/MultiScaleTreeGraph.jl
          ref: b3b39f5d33543fe2775756782ec1c4de33ba5775
          path: public-mtg
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.3'
      - name: Compare main, the historical engine and the final candidate on matching inputs
        run: python3 .ci/xpalm-matched/run.py "${{ matrix.scenario }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-xpalm-${{ matrix.scenario }}-linux
          path: ${{ runner.temp }}/xpalm-results/*.json
          if-no-files-found: warn
          retention-days: 14
